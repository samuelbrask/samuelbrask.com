<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizzen til festen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--dyb:#063033;--petrol:#0E5A67;--mint:#2AC8A5;--mintlys:#A6EDDE;
  --koral:#FF611A;--creme:#FFEAD7;--dis:#7FA0A4;--tone:#4C6E71;
  --h:'Montserrat',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dyb);color:var(--creme);font-family:var(--b);line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.ramme{max-width:1240px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:26px 0;flex-wrap:wrap;gap:14px}
.mrk{display:flex;align-items:center;gap:13px;font-size:13px;font-weight:600;color:var(--mint)}
.mrk::before{content:"";width:40px;height:1px;background:var(--mint);opacity:.6}
.knapper{display:flex;gap:9px}
button{font:600 15px/1 var(--b);cursor:pointer;border:0;border-radius:999px;padding:12px 20px}
.b1{background:var(--mint);color:var(--dyb)}
.b2{background:none;color:var(--mintlys);border:1px solid rgba(166,237,222,.3)}
h1{font-family:var(--h);font-weight:900;font-size:clamp(28px,4vw,44px);letter-spacing:-.03em;
  line-height:1;margin-bottom:8px}
.und{color:var(--dis);font-size:16px;margin-bottom:26px;max-width:62ch}

/* ---- plade ---- */
.plade{display:grid;gap:9px;margin-bottom:30px}
.kat{font-family:var(--h);font-weight:800;font-size:15px;text-align:center;padding:15px 8px;
  background:var(--petrol);border-radius:10px;letter-spacing:.01em;color:var(--mintlys)}
.felt{font-family:var(--h);font-weight:900;font-size:27px;text-align:center;padding:22px 8px;
  background:rgba(166,237,222,.07);border:1px solid rgba(166,237,222,.14);border-radius:10px;
  color:var(--mint);cursor:pointer;transition:.14s}
.felt:hover{background:rgba(42,200,165,.18);transform:translateY(-2px)}
.felt.brugt{color:rgba(166,237,222,.16);background:rgba(166,237,222,.03);cursor:default;transform:none}

/* ---- hold ---- */
.hold{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;
  padding-bottom:70px}
.h{background:rgba(166,237,222,.06);border:1px solid rgba(166,237,222,.14);border-radius:12px;
  padding:15px 17px}
.h input{background:none;border:0;color:var(--creme);font:700 16px var(--h);width:100%;
  margin-bottom:9px;border-bottom:1px solid transparent;padding-bottom:3px}
.h input:focus{outline:0;border-bottom-color:var(--mint)}
.pt{display:flex;align-items:center;justify-content:space-between;gap:9px}
.pt b{font-family:var(--h);font-weight:900;font-size:30px;font-variant-numeric:tabular-nums}
.pt button{width:36px;height:36px;padding:0;font-size:19px;background:rgba(166,237,222,.1);
  color:var(--mintlys)}

/* ---- spørgsmål ---- */
.sky{position:fixed;inset:0;background:rgba(3,25,27,.96);display:none;
  align-items:center;justify-content:center;padding:40px;z-index:40}
.sky.vis{display:flex}
.kort{max-width:980px;text-align:center}
.kort .v{font-family:var(--h);font-weight:900;font-size:66px;color:var(--koral);margin-bottom:22px}
.kort .sp{font-family:var(--h);font-weight:800;font-size:clamp(28px,4.4vw,52px);line-height:1.12;
  letter-spacing:-.02em;margin-bottom:34px}
.kort .sv{font-size:clamp(20px,2.4vw,30px);color:var(--mint);opacity:0;transition:opacity .3s;
  margin-bottom:34px}
.kort .sv.vis{opacity:1}

/* ---- redigering ---- */
.red{display:none}
.red.vis{display:block}
.spil.skjul{display:none}
.rk{display:grid;gap:9px;margin-bottom:12px}
.rk input,.rk textarea{background:rgba(166,237,222,.06);border:1px solid rgba(166,237,222,.16);
  border-radius:9px;color:var(--creme);font:500 15px var(--b);padding:11px 13px;width:100%;resize:vertical}
.rk input:focus,.rk textarea:focus{outline:0;border-color:var(--mint)}
.rkat{margin-bottom:22px;background:rgba(166,237,222,.04);border-radius:13px;padding:18px 20px}
.rkat > input{font:800 18px var(--h);margin-bottom:12px;background:none;border:0;
  border-bottom:1px solid rgba(166,237,222,.2);border-radius:0;padding:6px 2px}
.par{display:grid;grid-template-columns:70px 1fr 1fr;gap:9px;margin-bottom:8px;align-items:start}
.par .v{font-family:var(--h);font-weight:800;color:var(--mint);padding-top:12px;text-align:center}
@media(max-width:700px){.par{grid-template-columns:1fr}.par .v{text-align:left}}
</style>
</head>
<body>

<div class="ramme">
  <div class="top">
    <div class="mrk">AI Build Day · eksempel</div>
    <div class="knapper">
      <button class="b2" id="skift">Rediger spørgsmål</button>
      <button class="b2" id="nulstil">Nulstil point</button>
    </div>
  </div>

  <div class="spil" id="spil">
    <h1>Quizzen til festen</h1>
    <p class="und">Klik på et felt. Spørgsmålet fylder skærmen, så alle kan se det. Giv point med plus og minus. Alt gemmes i din browser.</p>
    <div class="plade" id="plade"></div>
    <div class="hold" id="hold"></div>
  </div>

  <div class="red" id="red">
    <h1>Skriv dine egne</h1>
    <p class="und">Ret i felterne. Det gemmer sig selv. Tryk på knappen i toppen for at komme tilbage til spillet.</p>
    <div id="redind"></div>
  </div>
</div>

<div class="sky" id="sky"><div class="kort">
  <div class="v" id="kv"></div>
  <div class="sp" id="ksp"></div>
  <div class="sv" id="ksv"></div>
  <div class="knapper" style="justify-content:center">
    <button class="b1" id="afslor">Vis svaret</button>
    <button class="b2" id="luk">Luk</button>
  </div>
</div></div>

<script>
const START={kat:[
 {n:"Dansk musik",sp:[
  ["Hvilken dansk sanger står bag 'Kære lille mormor'?","Rasmus Seebach"],
  ["Hvad hedder Medinas rigtige efternavn?","Valbak"],
  ["Hvilket år vandt Olsen Brothers Melodi Grand Prix?","2000"],
  ["Hvem synger 'Danse i måneskin'?","Lis Sørensen"],
  ["Hvilket band står bag 'Hvor Vinden Blæser Hen'?","Shu-Bi-Dua"]]},
 {n:"Film og tv",sp:[
  ["I hvilken by foregår Matador?","Korsbæk"],
  ["Hvem spiller Mads Skjern?","Jens Okking"],
  ["Hvad hedder hovedpersonen i Olsen-banden?","Egon Olsen"],
  ["Hvilken dansk film vandt en Oscar i 2021?","Druk"],
  ["Hvem instruerede Festen?","Thomas Vinterberg"]]},
 {n:"Geografi",sp:[
  ["Hvad er Danmarks største ø?","Sjælland"],
  ["Hvor mange kommuner er der i Danmark?","98"],
  ["Hvad hedder Danmarks højeste naturlige punkt?","Møllehøj"],
  ["Hvilken by ligger længst mod vest?","Esbjerg"],
  ["Hvor mange øer har Danmark cirka?","Omkring 400 navngivne"]]},
 {n:"Blandet",sp:[
  ["Hvad hedder dronningens mand, der døde i 2018?","Henrik"],
  ["Hvilket år fik Danmark Dannebrog, ifølge sagnet?","1219"],
  ["Hvad hedder Danmarks nationalret officielt?","Stegt flæsk med persillesovs"],
  ["Hvor mange sider har en terning?","Seks"],
  ["Hvad hedder verdens mindste land?","Vatikanstaten"]]}
], hold:[{n:"Hold 1",p:0},{n:"Hold 2",p:0},{n:"Hold 3",p:0}], brugt:[]};

let D=hent();
function hent(){try{const r=localStorage.getItem('quiz');return r?JSON.parse(r):structuredClone(START);}
  catch(e){return structuredClone(START);}}
function gem(){try{localStorage.setItem('quiz',JSON.stringify(D));}catch(e){}}

function tegnPlade(){
  const pl=document.getElementById('plade');
  pl.style.gridTemplateColumns='repeat('+D.kat.length+',1fr)';
  let h=D.kat.map(k=>'<div class="kat">'+esc(k.n)+'</div>').join('');
  for(let r=0;r<5;r++) D.kat.forEach((k,c)=>{
    const v=(r+1)*100, id=c+'-'+r, brugt=D.brugt.includes(id);
    h+='<div class="felt'+(brugt?' brugt':'')+'" data-id="'+id+'">'+v+'</div>';
  });
  pl.innerHTML=h;
  pl.querySelectorAll('.felt:not(.brugt)').forEach(f=>f.addEventListener('click',()=>aabn(f.dataset.id)));
}
function tegnHold(){
  document.getElementById('hold').innerHTML=D.hold.map((h,i)=>
    '<div class="h"><input value="'+esc(h.n)+'" data-i="'+i+'">'
    +'<div class="pt"><button data-m="'+i+'">&minus;</button><b>'+h.p+'</b>'
    +'<button data-p="'+i+'">+</button></div></div>').join('');
  document.querySelectorAll('.h input').forEach(e=>e.addEventListener('input',()=>{
    D.hold[e.dataset.i].n=e.value; gem();}));
  document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{
    D.hold[b.dataset.p].p+=vaerdi(); gem(); tegnHold();}));
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{
    D.hold[b.dataset.m].p-=vaerdi(); gem(); tegnHold();}));
}
let aktiv=null;
const vaerdi=()=>aktiv?(+aktiv.split('-')[1]+1)*100:100;
function aabn(id){
  aktiv=id; const [c,r]=id.split('-').map(Number);
  const s=D.kat[c].sp[r]||["",""];
  document.getElementById('kv').textContent=(r+1)*100;
  document.getElementById('ksp').textContent=s[0];
  document.getElementById('ksv').textContent=s[1];
  document.getElementById('ksv').classList.remove('vis');
  document.getElementById('sky').classList.add('vis');
}
document.getElementById('afslor').addEventListener('click',()=>
  document.getElementById('ksv').classList.add('vis'));
document.getElementById('luk').addEventListener('click',()=>{
  if(aktiv&&!D.brugt.includes(aktiv)){D.brugt.push(aktiv);gem();tegnPlade();}
  document.getElementById('sky').classList.remove('vis'); aktiv=null;});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('sky').classList.contains('vis'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();document.getElementById('ksv').classList.add('vis');}
  if(e.key==='Escape')document.getElementById('luk').click();});

document.getElementById('nulstil').addEventListener('click',()=>{
  D.hold.forEach(h=>h.p=0); D.brugt=[]; gem(); tegnPlade(); tegnHold();});

document.getElementById('skift').addEventListener('click',()=>{
  const r=document.getElementById('red');
  r.classList.toggle('vis');
  document.getElementById('spil').classList.toggle('skjul');
  document.getElementById('skift').textContent=r.classList.contains('vis')?'Tilbage til spillet':'Rediger spørgsmål';
  if(r.classList.contains('vis'))tegnRed(); else {tegnPlade();tegnHold();}
});
function tegnRed(){
  document.getElementById('redind').innerHTML=D.kat.map((k,c)=>
    '<div class="rkat"><input value="'+esc(k.n)+'" data-kn="'+c+'">'
    +k.sp.map((s,r)=>'<div class="par"><div class="v">'+((r+1)*100)+'</div>'
      +'<textarea rows="2" data-sp="'+c+'-'+r+'">'+esc(s[0])+'</textarea>'
      +'<textarea rows="2" data-sv="'+c+'-'+r+'">'+esc(s[1])+'</textarea></div>').join('')
    +'</div>').join('');
  document.querySelectorAll('[data-kn]').forEach(e=>e.addEventListener('input',()=>{
    D.kat[e.dataset.kn].n=e.value; gem();}));
  document.querySelectorAll('[data-sp]').forEach(e=>e.addEventListener('input',()=>{
    const [c,r]=e.dataset.sp.split('-').map(Number); D.kat[c].sp[r][0]=e.value; gem();}));
  document.querySelectorAll('[data-sv]').forEach(e=>e.addEventListener('input',()=>{
    const [c,r]=e.dataset.sv.split('-').map(Number); D.kat[c].sp[r][1]=e.value; gem();}));
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
tegnPlade(); tegnHold();
</script>
</body></html>
