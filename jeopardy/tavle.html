<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="p-board">
  <main id="stage" aria-live="polite"></main>
  <footer id="scores" class="scores"></footer>

  <button id="spBtn" class="sp-btn" type="button" aria-label="Musikindstillinger" title="Musik"><span class="sp-dot"></span>♪</button>
  <div id="spPanel" class="sp-panel" hidden>
    <p id="spStatus" class="sp-status"></p>
    <div id="spBody"></div>
  </div>

  <div id="startOverlay" class="start-overlay">
    <button id="startBtn" class="btn primary big" type="button">Start tavlen</button>
    <p>Ét klik, så browseren må spille lyd og musik. Tryk F for fuld skærm.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="spotify.js"></script>
  <script src="tavle.js"></script>
</body>
</html>
